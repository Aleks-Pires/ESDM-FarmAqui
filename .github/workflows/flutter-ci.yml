name: Flutter CI

on:
  push:
    branches:
      - main
      - feat/autenticacao-solid
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar scaffold Android
        run: flutter create --platforms=android --org br.edu.ufal --project-name farma_aqui .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analisar codigo
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK de debug
        run: flutter build apk --debug
